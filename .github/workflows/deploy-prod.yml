# Автодеплой prod при пуше в main. Доставка образа — без реестра, напрямую
# на сервер по SSH (deployer в forced command импортирует образ в containerd
# и катит `kubectl set image`). Подробности — deploy/README.md и
# simple-deploy/kube/backend-deploy.md.
#
# Стандарты (simple-deploy/standards/delivery/*):
#   - иммутабельный тег образа prod-<short-sha>, деплоится ровно github.sha;
#   - деплой гейтится зелёными тестами (job test);
#   - в образ впекаются APP_VERSION/GIT_COMMIT/BUILD_DATE (отдаются в /version.json);
#   - откат = перезапуск run'а предыдущего коммита (gh run rerun <id>).
#
# Секреты репозитория: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT, DEPLOY_KNOWN_HOSTS,
# (Ш2, опционально пока не заведены координатором) CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy-prod
on: { push: { branches: [main] } }
concurrency: { group: deploy-prod, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  # Красные тесты не пускают деплой: протокол сигналинга гоняется целиком
  # (тест сам собирает и поднимает сервер). Браузерный e2e в CI не гоняем.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Тесты протокола сигналинга (включает cargo build)
        run: node tests/signaling.test.mjs

  # Браузерный e2e-гейт: тот же basic.spec.mjs, что локально — стабы медиа
  # синтетические по умолчанию, Chrome на ubuntu-раннере предустановлен.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Браузерный e2e (basic)
        run: |
          cd tests/e2e && npm install --no-audit --no-fund
          node basic.spec.mjs

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, тег prod-<sha>)
        run: |
          TAG="prod-$(git rev-parse --short HEAD)"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker buildx build --provenance=false --sbom=false --platform linux/amd64 \
            --build-arg APP_VERSION="$TAG" \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t "chat:$TAG" .
      - name: Deliver + deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m600 /dev/stdin key <<<"$KEY"
          mkdir -p ~/.ssh && printf '%s\n' "$KNOWN" >> ~/.ssh/known_hosts
          docker save "chat:$TAG" | gzip | ssh -i key -p "$PORT" "deployer@$HOST" "prod $TAG"

  # Ш2 (разнесение доверия — см. README.md «Топология Ш2»): статика фронтенда
  # уезжает на Cloudflare Pages (проект «chat-web»), backend остаётся
  # только API/WS. Независим от job `deploy` (тот катит образ backend'а на
  # свой сервер) — просто тоже гейтится теми же зелёными test/e2e.
  #
  # ГЕЙТ: пока координатор не завёл Pages-проект и секреты
  # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID, шаг деплоя мягко скипается
  # (echo + exit 0 в отдельном шаге-гейте) — пайплайн остаётся зелёным.
  deploy-pages:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать pages-dist/ (копия static/ + config.js под API-хост)
        run: |
          rm -rf pages-dist
          cp -r static pages-dist
          # Ш2: Pages-сборка ходит на отдельный API-хост — same-origin дефолт
          # из репозитория (static/config.js: window.API_BASE = location.origin)
          # здесь не годится, фронт и API теперь на разных доменах (см.
          # deploy/manifests/ingress.yaml, src/main.rs::CORS_ORIGIN).
          cat > pages-dist/config.js <<'EOF'
          'use strict';
          window.API_BASE = 'https://chat-api.fedorov.it';
          EOF
          # Кэш: у Pages свой edge-кэш, независимый от Cache-Control нашего
          # origin (см. src/main.rs::NO_CACHE) — тот же принцип «безусловный
          # no-cache», чтобы после деплоя не залипала старая статика (ровно
          # та проблема, из-за которой на origin завели NO_CACHE, см. там же).
          # Кэш-бастер ?v=N в HTML — не трогаем, разметка копируется как есть.
          printf '/*\n  Cache-Control: no-cache\n' > pages-dist/_headers
      - name: Проверка секрета CLOUDFLARE_API_TOKEN (гейт — Pages-проект/токен заводит координатор)
        id: gate
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN ещё не задан — пропускаем деплой на Cloudflare Pages."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Деплой на Cloudflare Pages (project chat-web)
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy pages-dist --project-name=chat-web --branch=main
