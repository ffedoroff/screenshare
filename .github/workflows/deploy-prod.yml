# Auto-deploy to prod on push to main. Image delivery — no registry, directly
# to the server over SSH (the deployer's forced command imports the image into containerd
# and rolls out via `kubectl set image`). Details — deploy/README.md and
# simple-deploy/kube/backend-deploy.md.
#
# Standards (simple-deploy/standards/delivery/*):
#   - immutable image tag prod-<short-sha>, deploys exactly github.sha;
#   - deploy is gated on green tests (job test);
#   - APP_VERSION/GIT_COMMIT/BUILD_DATE are baked into the image (exposed via /version.json);
#   - rollback = rerun of the previous commit's run (gh run rerun <id>).
#
# Repository secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT, DEPLOY_KNOWN_HOSTS,
# (S2, optional until set up by the coordinator) CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy-prod
on: { push: { branches: [main] } }
concurrency: { group: deploy-prod, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  # Failing tests block the deploy: the signaling protocol is exercised end-to-end
  # (the test itself builds and starts the server). Browser e2e is a separate
  # job `e2e` below (also gates the deploy).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Signaling protocol tests (includes cargo build)
        run: node tests/signaling.test.mjs

  # Browser e2e gate: same basic/resilience suites as locally — media stubs
  # are synthetic by default, Chrome is preinstalled on the ubuntu runner.
  # basic and resilience run as SEPARATE invocations (separate node processes):
  # chaining them into one command makes resilience flaky — the previous suite's
  # ports/contexts don't get released in time; separate processes release them on exit.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Install e2e dependencies
        run: cd tests/e2e && npm install --no-audit --no-fund
      - name: Browser e2e (basic)
        run: cd tests/e2e && node basic.spec.mjs
      - name: Browser e2e (resilience) — separate run
        run: cd tests/e2e && node resilience.spec.mjs

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, tag prod-<sha>)
        run: |
          TAG="prod-$(git rev-parse --short HEAD)"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker buildx build --provenance=false --sbom=false --platform linux/amd64 \
            --build-arg APP_VERSION="$TAG" \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t "chat:$TAG" .
      - name: Deliver + deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m600 /dev/stdin key <<<"$KEY"
          mkdir -p ~/.ssh && printf '%s\n' "$KNOWN" >> ~/.ssh/known_hosts
          docker save "chat:$TAG" | gzip | ssh -i key -p "$PORT" "deployer@$HOST" "prod $TAG"

  # S2 (trust separation — see README.md "S2 topology"): frontend static assets
  # go to Cloudflare Pages (project "chat-web"), the backend remains
  # API/WS only. Independent from job `deploy` (which rolls out the backend
  # image to its own server) — just also gated by the same green test/e2e.
  #
  # GATE: until the coordinator sets up the Pages project and the
  # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets, the deploy step is soft-skipped
  # (echo + exit 0 in a separate gate step) — the pipeline stays green.
  deploy-pages:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Selectively elevate permissions ONLY for this job (globally in the file —
    # contents: read, see top of file) — contents: write is needed exactly for
    # the "Publish bundle hash to GitHub Release" step below (creating/editing
    # the release via `gh`). Other jobs (test/e2e/deploy) are unaffected by
    # this block — per-job permissions fully replace the global ones only
    # for the job where they're set.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build pages-dist/ (copy of static/ + config.js for the API host)
        run: |
          rm -rf pages-dist
          # Structure matches the origin server: assets under /static/*, pages at
          # the root (HTML references /static/foo.js — see src/main.rs routes).
          mkdir pages-dist
          cp -r static pages-dist/static
          mv pages-dist/static/index.html pages-dist/static/room.html pages-dist/ 2>/dev/null || cp static/index.html static/room.html pages-dist/
          # SPA room route: /r/<id> serves room.html (rewrite, not redirect).
          printf '/r/* /room 200\n' > pages-dist/_redirects   # target without .html: otherwise Pages' own pretty-URL handling gives a 308 and loses the path
          # S2: the Pages build talks to a separate API host — the same-origin default
          # from the repo (static/config.js: window.API_BASE = location.origin)
          # doesn't work here, the frontend and API are now on different domains (see
          # deploy/manifests/ingress.yaml, src/main.rs::CORS_ORIGIN).
          cat > pages-dist/static/config.js <<'EOF'
          'use strict';
          window.API_BASE = 'https://chat-api.fedorov.it';
          EOF
          # Cache: Pages has its own edge cache, independent of our origin's
          # Cache-Control (see src/main.rs::NO_CACHE) — same "unconditional
          # no-cache" principle, so stale static assets don't stick around after a
          # deploy (exactly the problem NO_CACHE was introduced for on the origin, see there).
          # Cache-buster ?v=N in the HTML — left untouched, markup is copied as-is.
          #
          # M2 — strict security headers (see tests/e2e/basic.spec.mjs,
          # the CSP/frame-ancestors check on the generated _headers):
          #   - script-src/style-src 'self', with NO 'unsafe-inline' — nowhere in
          #     static/ is there a single inline <script>/<style>/style="..."
          #     (all scripts are external files, see static/*.html), and the pointwise
          #     JS mutations via CSSOM (element.style.foo = ...; see
          #     static/room.js/chat.js — tile gradients, file progress
          #     bars, reaction popup positioning) are not affected by CSP style-src —
          #     confirmed by local testing (Chromium
          #     + securitypolicyviolation, see the decision history): such
          #     mutations don't go through parsing the style attribute, only
          #     inline markup does that, and there is none in the project;
          #   - connect-src 'self' + the API/WS host itself (S2, see static/config.js
          #     in the Pages build above) — WebRTC/getUserMedia/getDisplayMedia
          #     don't go through fetch/XHR/WebSocket, CSP doesn't concern them at all
          #     (SDP/ICE IS the P2P transport itself, not covered by connect-src),
          #     STUN/TURN don't go through connect-src either;
          #   - img-src/media-src allow data:/blob: — inline previews of chat
          #     files and objectURLs for downloaded/received files and images
          #     (see static/chat.js: URL.createObjectURL) won't render without them;
          #   - frame-ancestors 'none' — the room can't be embedded in an external
          #     frame (clickjacking), duplicated by X-Frame-Options: DENY for
          #     browsers without CSP level 2 support;
          #   - Permissions-Policy allows camera/microphone/display-capture
          #     ONLY for self (the frame itself, no nested foreign origins) — otherwise
          #     they'd be accessible to potential third-party frames.
          cat > pages-dist/_headers <<'HEADERS'
          /*
            Cache-Control: no-cache
            Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://chat-api.fedorov.it wss://chat-api.fedorov.it; frame-ancestors 'none'; base-uri 'none'; form-action 'none'
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
            Permissions-Policy: camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()
          HEADERS
      - name: Compute deterministic SHA-256 of the bundle and write pages-dist/build-hash.json
        # Forensic anchor against static-asset tampering by the host (S2 — see
        # docs/security.md, "Published Build Hash"): regardless of what
        # Cloudflare Pages actually serves, anyone verifying has a way to recompute
        # the same hash from source and check it against the GitHub Release (next
        # step) — Cloudflare doesn't control that Release channel.
        #
        # Formula (this EXACT command is documented in docs/security.md for
        # independent recomputation — don't change one without the other):
        #   cd pages-dist && find . -type f ! -name build-hash.json \
        #     | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1
        # — sha256 of every file in the bundle (except build-hash.json, which doesn't
        # exist yet at this point), the list of "hash  path" lines is sorted
        # BYTEWISE (LC_ALL=C — independent of the runner's/verifier's locale), this
        # whole text is then hashed again as a whole -> take the first field.
        # cd into pages-dist is REQUIRED before find: paths must be relative
        # (`./static/chat.js`, not `/home/runner/.../pages-dist/static/chat.js`)
        # — otherwise the hash would depend on the checkout's absolute path and wouldn't
        # match for a third-party verifier who unpacked the bundle into a different directory.
        # build-hash.json is written AFTER the computation and doesn't hash itself
        # (`! -name build-hash.json`) — otherwise the decision of "what to put in the file"
        # would depend on the file's own contents.
        id: hash
        run: |
          cd pages-dist
          HASH=$(find . -type f ! -name build-hash.json | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          COMMIT="$(git -C .. rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"hash":"%s","commit":"%s","buildDate":"%s"}' "$HASH" "$COMMIT" "$BUILD_DATE" > build-hash.json
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
      - name: Publish bundle hash to GitHub Release (independent verification channel, see docs/security.md)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          COMMIT="${{ steps.hash.outputs.commit }}"
          SHORT_SHA="$(git rev-parse --short "$COMMIT")"
          TAG="pages-$SHORT_SHA"
          NOTES="$(cat <<EOF
          Frontend static assets (Cloudflare Pages), commit \`$COMMIT\`.

          - Bundle SHA-256: \`${{ steps.hash.outputs.hash }}\`
          - commit: \`$COMMIT\`
          - buildDate (UTC): \`${{ steps.hash.outputs.build_date }}\`

          Recompute it yourself: build pages-dist/ using the same steps as
          this workflow (see .github/workflows/deploy-prod.yml, job
          deploy-pages, step "Build pages-dist/"), then from the bundle root:

              cd pages-dist && find . -type f ! -name build-hash.json | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1

          (macOS has no sha256sum by default — use \`shasum -a 256\`, same
          algorithm and output format, the result will match).

          This is a forensic verification checkpoint — an independent channel (this very
          Release), NOT a cryptographic guarantee: the static-asset host could theoretically
          also tamper with what /build-hash.json itself serves on the page, so
          verification should be against THIS value, not what the page itself
          shows. Details and honest limitations — docs/security.md,
          "Published Build Hash".
          EOF
          )"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$COMMIT" \
            || gh release edit "$TAG" --notes "$NOTES"
      - name: Check CLOUDFLARE_API_TOKEN secret (gate — Pages project/token is set up by the coordinator)
        id: gate
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN not set yet — skipping deploy to Cloudflare Pages."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages (project chat-web)
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy pages-dist --project-name=chat-web --branch=main
