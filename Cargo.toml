[package]
name = "screenshare"
version = "0.1.0"
edition = "2021"
description = "Browser screen sharing: mesh P2P WebRTC + Rust signaling server"

[dependencies]
# Web framework with built-in WebSocket support
axum = { version = "0.8", features = ["ws"] }
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "signal"] }
# Serialization of signaling messages
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# peerId generation (also used as an entropy source for the short roomId)
uuid = { version = "1", features = ["v4"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# H1 (ephemeral TURN credentials, see src/main.rs::ice_config): HMAC-SHA1 over
# TURN_STATIC_SECRET in the TURN REST API style (draft-uberti-behave-turn-rest-00,
# compatible with turn-rs `auth.static-auth-secret`) — minimal features, no
# std-rand/OID/zeroize, we don't need those.
hmac = { version = "0.13.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
# credential in iceServers — base64(HMAC-SHA1(...)), as expected by turn-rs.
base64 = "0.22.1"
# Prometheus metrics (see src/metrics.rs, src/main.rs::management_router) — the
# same crate/pattern as code-ranker-backend (separate management port,
# PrometheusBuilder::install_recorder() + PrometheusHandle::render() on
# /metrics), see simple-deploy/standards/observability/metrics.md.
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
# Embedded TURN (optional, only pulled in behind the `embedded-turn` Cargo
# feature below — see docs/self-hosting.md, "TURN (Optional)"): a patched
# turn-rs fork whose metrics are emitted through the `metrics` facade crate
# above, so they land in the SAME global recorder/registry this process
# already installs in `main()` — no second Prometheus registry, no second
# `/metrics` endpoint to scrape. `default-features = false` + an explicit
# feature list: the UDP/TCP data plane + the metrics facade, plus `ssl`
# (rustls) so the embedded server can terminate TLS on the optional
# TURNS/443 interface (see src/embedded_turn.rs) for "443-only" networks —
# NOT upstream's own `api` (tonic/axum-server gRPC control plane), which
# this embedding doesn't use and which the default (split, production)
# build must not pull in at all.
turn-server = { git = "https://github.com/ffedoroff/turn-rs", rev = "95bc72188ba01ce447cf438e635b083a49516889", default-features = false, features = ["udp", "tcp", "metrics-facade", "ssl"], optional = true }

[features]
# Off by default: production stays "split" — turn-rs runs as its own
# separate process/deployment (see deploy/manifests/turn.yaml,
# docs/self-hosting.md, "TURN (Optional)"). This feature exists for
# self-host operators who'd rather run a single binary/container with TURN
# baked in, at the cost of the two processes sharing fate (one restart/OOM
# takes both down together — acceptable for a single self-hosted node, not
# for the split production deployment).
embedded-turn = ["dep:turn-server"]
