[package]
name = "screenshare"
version = "0.1.0"
edition = "2021"
description = "Браузерный шеринг экрана: mesh P2P WebRTC + Rust signaling-сервер"

[dependencies]
# Веб-фреймворк с встроенной поддержкой WebSocket
axum = { version = "0.8", features = ["ws"] }
# Асинхронный рантайм
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "signal"] }
# Сериализация сообщений сигналинга
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Генерация peerId (и как источник энтропии для короткого roomId)
uuid = { version = "1", features = ["v4"] }
# Логирование
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# QR-код для /qr.svg: чистый Rust. Без default-фич — они тянут декодер
# растровых изображений (крейт image), который нам не нужен; берём только
# "svg" (рендер в SVG).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
