# Deployment приложения. Создаёт админ ОДИН РАЗ; deploy-юзер (CI) потом только
# `kubectl set image '*=…'` (см. .github/workflows/deploy-prod.yml и
# simple-deploy/kube/backend-deploy.md).
#
# ОТСТУПЛЕНИЕ от обычного бесшовного шаблона (replicas:2 + RollingUpdate):
# здесь replicas: 1 и strategy.type: Recreate. Причина — состояние комнат
# живёт в памяти ОДНОГО процесса (`src/state.rs`, HashMap за std::sync::Mutex):
# при двух репликах broadcaster и зрители могли бы попасть на разные поды и
# никогда не увидеть друг друга. Recreate = на деплое старый под гасится,
# новый поднимается — активные трансляции на несколько секунд рвутся, это
# ожидаемо и описано в README.md.
#
# Полная эфемерность: приложение ничего не пишет на диск (ни истории чата,
# ни сессий) — всё состояние комнаты живёт только в памяти процесса и
# исчезает с ней (рестарт/реапер пустой комнаты). Поэтому здесь сознательно
# нет volume/volumeMount и PVC: писать некуда, и это правильно, а не упущение.
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat, namespace: chat-prod }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: chat } }
  template:
    metadata: { labels: { app: chat } }
    spec:
      terminationGracePeriodSeconds: 30       # graceful drain; приложение ловит SIGTERM (src/main.rs)
      containers:
      - name: app
        image: chat:PLACEHOLDER               # реальный тег ставит `kubectl set image '*='`
        imagePullPolicy: IfNotPresent
        env:
        - { name: PORT, value: "8080" }
        - { name: STATIC_DIR, value: "/app/static" }
        ports: [ { containerPort: 8080 } ]
        readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 3 }
        livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
        resources:
          # Rust-сервер сигналинга лёгкий (мелкий рабочий набор в памяти,
          # никакого медиатрафика через backend не проходит) — лимиты скромные.
          requests: { memory: 32Mi, cpu: 50m }
          limits:   { memory: 128Mi, cpu: 250m }
