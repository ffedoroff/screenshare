# Application Deployment. Created by an admin ONCE; the deploy user (CI) afterwards only
# does `kubectl set image '*=…'` (see .github/workflows/deploy-prod.yml and
# simple-deploy/kube/backend-deploy.md).
#
# DEPARTURE from the usual seamless template (replicas:2 + RollingUpdate):
# here it's replicas: 1 and strategy.type: Recreate. Reason — room state
# lives in the memory of ONE process (`src/state.rs`, HashMap behind std::sync::Mutex):
# with two replicas, the broadcaster and viewers could land on different pods and
# never see each other. Recreate = on deploy the old pod is torn down, the
# new one comes up — active broadcasts drop for a few seconds, this is
# expected and described in README.md.
#
# Fully ephemeral: the application writes nothing to disk (no chat history,
# no sessions) — all room state lives only in the process's memory and
# disappears with it (restart/empty-room reaper). That's why there's deliberately
# no volume/volumeMount or PVC here: there's nowhere to write, and that's by design, not an oversight.
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat, namespace: chat-prod }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: chat } }
  template:
    metadata:
      labels: { app: chat }
      # Prometheus kubernetes_sd_config (role: pod) autodiscovery — the same
      # pattern as code-ranker-backend (see
      # code-ranker-private/deploy/kubesolo/manifests/deployment.yaml) and
      # simple-deploy/standards/observability/metrics.md, §"Target
      # Autodiscovery". Scrapes a SEPARATE management port (8081, see `mgmt`
      # below), never the main 8080 (WS signaling/static assets, behind
      # Service/Ingress) — /metrics is NOT exposed externally.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30       # graceful drain; the app catches SIGTERM (src/main.rs)
      containers:
      - name: app
        image: chat:PLACEHOLDER               # the real tag is set by `kubectl set image '*='`
        imagePullPolicy: IfNotPresent
        env:
        - { name: PORT, value: "8080" }
        # Management port (see src/main.rs::spawn_metrics_server) — just
        # `/metrics`, the same pattern/default (8081) as code-ranker-backend.
        # Deliberately NOT in service.yaml (see its comment): scraping goes
        # directly to the pod IP via the annotations above, not through the Service.
        - { name: MGMT_PORT, value: "8081" }
        - { name: STATIC_DIR, value: "/app/static" }
        # S2 (trust separation — see README.md "S2 topology"): the frontend moves
        # to Cloudflare Pages (chat.fedorov.it), this server still answers on
        # both chat.fedorov.it (while static assets are still served from here too,
        # before the DNS switch) and chat-api.fedorov.it (see ingress.yaml) — so the only
        # allowed CORS origin for cross-host requests from Pages is
        # chat.fedorov.it. Empty -> CORS disabled entirely (see src/main.rs::CORS_ORIGIN).
        - { name: CORS_ORIGIN, value: "https://chat.fedorov.it" }
        # Call duration limit (see README.md "Call Duration Limit"):
        # a room older than this age gets deleted by the reaper
        # entirely (all participants receive room-expired and the socket closes),
        # even if it still has live participants. 10800s = 3 hours.
        - { name: MAX_ROOM_LIFETIME_SECONDS, value: "10800" }
        # H2 (DoS protection): ceiling on the number of concurrent rooms — same
        # default as in the code (500), spelled out here for visibility in the manifest.
        - { name: MAX_ROOMS, value: "500" }
        # TURN credentials (turn.yaml + Secret turn-creds, created by hand by an admin):
        # the app hands them to clients in /config. optional — without the secret
        # the app runs on STUN alone, as before.
        envFrom:
        - secretRef: { name: turn-creds, optional: true }
        # 8080 — WS signaling/static assets (in the Service, see service.yaml); 8081 —
        # management (only /metrics for now — /healthz stays on 8080, the
        # probes below already read it there, no reason to move it).
        ports:
        - { name: http, containerPort: 8080 }
        - { name: mgmt, containerPort: 8081 }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 3 }
        livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
        resources:
          # The Rust signaling server is lightweight (small working set in memory,
          # no media traffic ever passes through the backend) — modest limits.
          # 2026-09-06: cpu request 10m -> 100m. Узел насыщен по CPU (temper 5 ядер, idle 8–14 %):
          # CFS-доля под нагрузкой пропорциональна requests, при 10m /healthz таймаутил и пробы
          # флапали (events Unhealthy 06.09). registry hosts/contabo121200342/incidents/2026-09-06-memory-review.md п.7.
          requests: { memory: 100Mi, cpu: 100m }
          limits:   { memory: 128Mi, cpu: 250m }
