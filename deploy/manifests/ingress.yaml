# Published externally via cloudflare-tunnel-ingress-controller (already deployed
# on the cluster, also serves other projects — see simple-deploy/cloudflare/tunnel.md
# "Option 2"). The controller sets up the tunnel and DNS record from this Ingress itself —
# nothing needs to be created separately in the Cloudflare dashboard.
#
# S2 (trust separation — see README.md "S2 topology"): frontend static assets
# move to Cloudflare Pages (project "chat-web"), while this backend remains
# the API/WS host at chat-api.fedorov.it. The switch happened on 2026-07-13:
# chat.fedorov.it now points via CNAME to Pages (chat-web-7ev.pages.dev),
# and its rule was removed from the Ingress (otherwise the tunnel controller would fight
# over the DNS record). The backend can still serve static assets (harmless,
# reachable at chat-api) — cleanup can be done later as a separate step.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: chat, namespace: chat-prod }
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: chat-api.fedorov.it
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: chat, port: { number: 80 } }
