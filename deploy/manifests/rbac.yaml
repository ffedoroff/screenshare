# Permissions for the deploy user (CI) in this namespace. ServiceAccount `deployer` in ns
# `deploy` — shared across all projects on the server, set up once at the cluster level
# (simple-deploy/artifacts/server/rbac.yaml); here it's just the Role+RoleBinding
# restricting it to permissions within chat-prod. Applied by an admin.
#
# Permissions: only patching the existing Deployment, reading pods/logs. No
# secrets, no creating resources, no cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: chat-prod }
rules:
- { apiGroups: ["apps"], resources: ["deployments"], verbs: ["get","list","watch","patch","update"] }
- { apiGroups: ["apps"], resources: ["replicasets"], verbs: ["get","list","watch"] }   # rollout status
- { apiGroups: [""],     resources: ["pods","pods/log"], verbs: ["get","list","watch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: deployer, namespace: chat-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer }
subjects: [ { kind: ServiceAccount, name: deployer, namespace: deploy } ]
