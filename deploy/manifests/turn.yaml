# TURN server (turn-rs / ghcr.io/mycrl/turn-server) for peers that can't
# reach each other directly (symmetric NAT). Media through TURN is encrypted
# (DTLS-SRTP) — the relay only ever sees bytes and IPs.
#
# hostNetwork: the relay hands out UDP from the range 49160..49999 — exposing
# such a range through Services makes no sense, the pod sits directly on the node's network.
# Ports are open in Contabo's CLOUD firewall (hosting panel, 2026-07-12):
# UDP 3478 + 49160-49999 (see registry, host card).
#
# TURNS/443 (TCP, TLS) — fallback for "443-only" networks where nothing but
# TCP 443 egresses at all (see docs/network-profiles.md, Sofia Airport
# snapshot, and docs/self-hosting.md TURNS/443 section, 2026-07-18):
# alongside the existing UDP 3478 interface, `config.toml` (in Secret
# turn-config, below) needs a SECOND `[[server.interfaces]]` block:
#   [[server.interfaces]]
#   transport = "tcp"
#   listen = "0.0.0.0:443"
#   external = "<public IP>:443"
#   [server.interfaces.ssl]
#   private-key = "/etc/turn-tls/tls.key"
#   certificate-chain = "/etc/turn-tls/tls.crt"
# TCP 443 must ALSO be opened in Contabo's cloud firewall (hosting panel) —
# the same place UDP 3478 + the relay range were opened above; it is a
# separate rule from whatever already allows 443 for the chat/signaling
# ingress on this host, since this is the TURN pod's own hostNetwork port.
#
# H1 (ephemeral TURN credentials, see README.md "TURN Server" and
# src/main.rs::ice_config, 2026-07-13): previously `config.toml` held
# `[auth.static-credentials]` (a single login/password pair, valid indefinitely
# for ANYONE who reached `/config`) — now instead it's
# `auth.static-auth-secret = "<TURN_STATIC_SECRET>"` — a long-term credential
# following the TURN REST API scheme (coturn-style HMAC-SHA1, confirmed against
# turn-rs sources, `codec::crypto::static_auth_secret`), the backend computes a
# fresh username/credential on every call to `/config` (a TTL timestamp in the
# username, see the detailed comment in `ice_config` — turn-rs itself does NOT
# check this timestamp; the real bound on a leaked pair's lifetime is periodic
# rotation of this secret, not the expiry embedded in the username).
#
# Secrets (NOT in git, set up/rotated by hand by an admin):
#   - Secret turn/turn-config: the whole config.toml (realm, port-range,
#     external=<public IP>:3478, `auth.static-auth-secret=<TURN_STATIC_SECRET>`
#     — the same value as in the Secret below, WITHOUT a separate login/password pair;
#     now also holds the second, TCP/TLS 443 `[[server.interfaces]]` block described above).
#   - Secret turn/turn-tls: the TLS cert/key for the TURNS/443 listener —
#     `tls.crt` (full certificate chain, PEM) and `tls.key` (private key, PEM),
#     for the hostname clients reach the TURN server at. NOT in git; created
#     and renewed BY HAND by an admin (no cert-manager in this cluster) — e.g.
#     Let's Encrypt via a DNS-01 challenge (Cloudflare DNS, since TCP 443 on
#     this host is TURN, not a webserver ACME could HTTP-01 against), copied
#     in roughly every ~90 days. See docs/self-hosting.md TURNS/443 section.
#   - Secret chat-prod/turn-creds: TURN_URL/TURN_STATIC_SECRET (the
#     TURN_STATIC_SECRET key — that same value from turn/turn-config above) —
#     picked up by the chat Deployment (envFrom), which uses them to hand clients
#     FRESH TURN credentials in `/config`, not a shared pair. TURN_USERNAME/
#     TURN_PASSWORD can be left in the same Secret as a fallback during the
#     migration (see `ice_config`) — once `TURN_STATIC_SECRET` is set up,
#     the backend no longer reads them.
apiVersion: v1
kind: Namespace
metadata: { name: turn }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: turn-server, namespace: turn }
spec:
  replicas: 1
  strategy: { type: Recreate }   # hostNetwork: two pods can't share the port
  selector: { matchLabels: { app: turn-server } }
  template:
    metadata: { labels: { app: turn-server } }
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 10
      containers:
      - name: turn
        image: ghcr.io/mycrl/turn-server:latest
        imagePullPolicy: IfNotPresent
        # The image has no ENTRYPOINT — without command, kubelet would treat args as
        # the executable (we hit a CrashLoop with "/--config… not found").
        command: ["turn-server"]
        args: ["--config=/etc/turn-server/config.toml"]
        volumeMounts:
        - { name: config, mountPath: /etc/turn-server, readOnly: true }
        - { name: tls, mountPath: /etc/turn-tls, readOnly: true }
        resources:
          requests: { memory: 100Mi, cpu: 10m }
          limits: { memory: 100Mi, cpu: 500m }
      volumes:
      - name: config
        secret: { secretName: turn-config }
      - name: tls
        secret: { secretName: turn-tls }
