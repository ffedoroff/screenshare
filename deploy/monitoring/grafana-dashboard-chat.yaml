# Grafana dashboard "chat" (see src/metrics.rs) — modeled after
# grafana-dashboard-code-ranker (same ConfigMap format + provider mechanism,
# see `grafana-dashboards-provider` in ns `monitoring`: the sidecar provisioner
# reads JSON dashboards from `/var/lib/grafana/dashboards`, where each such
# ConfigMap is projected as a separate file via a projected volume in the
# `grafana` Deployment (ns `monitoring`) — see below, "How to Apply").
#
# Datasource `PBFA97CFB590B2093` — the same Prometheus datasource already
# used by the other dashboards in the cluster (code-ranker/store/node-exporter) —
# see `grafana-datasources` in ns `monitoring`.
#
# The namespace is hardcoded (`chat-prod`) directly in the panels' PromQL
# queries, rather than via a $namespace variable (like code-ranker, which has
# stage+prod) — chat has only one namespace, an extra variable would just add
# an extra click with no benefit.
