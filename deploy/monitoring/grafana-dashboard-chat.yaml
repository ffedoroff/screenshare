# Grafana-дашборд «chat» (см. src/metrics.rs) — по образцу
# grafana-dashboard-code-ranker (тот же формат ConfigMap + provider-механизм,
# см. `grafana-dashboards-provider` в ns `monitoring`: sidecar-провижининг
# читает JSON-дашборды из `/var/lib/grafana/dashboards`, куда каждый такой
# ConfigMap проецируется как отдельный файл через projected volume в
# Deployment `grafana` (ns `monitoring`) — см. ниже, «Как применить»).
#
# Датасорс `PBFA97CFB590B2093` — тот же Prometheus-датасорс, что уже
# используют остальные дашборды кластера (code-ranker/store/node-exporter) —
# см. `grafana-datasources` в ns `monitoring`.
#
# Namespace фиксирован (`chat-prod`) прямо в PromQL-запросах панелей, а не
# через $namespace-переменную (как у code-ranker, где есть stage+prod) —
# у chat всего один namespace, лишняя переменная только добавляла бы клик
# лишний раз без всякой пользы.
