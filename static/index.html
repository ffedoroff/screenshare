<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1114" />
  <title>Созвон — создать комнату</title>
  <link rel="stylesheet" href="/static/style.css?v=4" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
</head>
<body class="page-landing">
  <div class="landing-page">
    <div class="landing-card">
      <h1>Созвон с шарингом экрана</h1>
      <p>Без регистрации: создайте комнату и поделитесь ссылкой с остальными. Имя спросит сама комната при входе.</p>

      <button id="create-room-button" class="start-button">Создать комнату</button>

      <div id="landing-message" class="status-message"></div>

      <!-- Форензический якорь против подмены статики хостером (Ш2, см.
           docs/security.md, «Published Build Hash») — НЕ криптогарантия,
           только точка сверки с независимым каналом (GitHub Release).
           Скрыт, пока /build-hash.json не подтянулся (см. static/landing.js:
           loadBuildHash) — в dev/self-hosted сборке файла нет вовсе, и это
           штатно. -->
      <footer id="landing-build-footer" class="build-footer hidden">
        <details class="build-details">
          <summary class="build-summary">build: <span id="landing-build-short"></span></summary>
          <div id="landing-build-full" class="build-full"></div>
        </details>
        <a
          id="landing-build-verify-link"
          class="build-verify-link"
          href="https://github.com/ffedoroff/screenshare/releases"
          target="_blank"
          rel="noopener noreferrer"
          >verify</a
        >
      </footer>
    </div>
  </div>

  <script src="/static/config.js?v=4"></script>
  <script src="/static/crypto.js?v=4"></script>
  <script src="/static/landing.js?v=4"></script>
</body>
</html>
