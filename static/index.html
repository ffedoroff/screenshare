<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Созвон — создать комнату</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="landing-page">
    <div class="landing-card">
      <h1>Созвон с шарингом экрана</h1>
      <p>Без регистрации: создайте комнату и поделитесь ссылкой с остальными.</p>

      <input
        id="name-input"
        class="name-input"
        type="text"
        placeholder="Ваше имя (необязательно)"
        maxlength="40"
        autocomplete="off"
      />

      <button id="create-room-button" class="start-button">Создать комнату</button>

      <div id="landing-message" class="status-message"></div>
    </div>
  </div>

  <script src="/static/landing.js"></script>
</body>
</html>
