<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1114" />
  <title>Video call — create room</title>
  <link rel="stylesheet" href="/static/style.css?v=16" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
</head>
<body class="page-landing">
  <div class="landing-page">
    <div class="landing-card">
      <h1>Video call</h1>

      <!-- Room name input + "regenerate" button (see static/landing.js) in
           a single row — a compact control, no form submission (button
           type="button"). -->
      <div class="input-with-regen">
        <input id="room-name-input" class="name-input" type="text" maxlength="40"
               autocomplete="off" aria-label="Room name (shared with everyone who has the link)" />
        <button id="room-name-regen-button" type="button" class="regen-button" aria-label="Generate new name" title="Generate new name">↻</button>
      </div>

      <button id="create-room-button" class="start-button">Create room</button>

      <div id="landing-message" class="status-message"></div>

      <!-- Forensic anchor against tampering with the static assets by the
           host (Step 2, see docs/security.md, "Published Build Hash") — NOT
           a cryptographic guarantee, just a verification point against an
           independent channel (GitHub Release). Hidden until
           /build-hash.json has loaded (see static/landing.js:
           loadBuildHash) — in the dev/self-hosted build the file doesn't
           exist at all, and that's expected. -->
      <footer id="landing-build-footer" class="build-footer hidden">
        <details class="build-details">
          <summary class="build-summary">build: <span id="landing-build-short"></span></summary>
          <div id="landing-build-full" class="build-full"></div>
        </details>
        <a
          id="landing-build-verify-link"
          class="build-verify-link"
          href="https://github.com/ffedoroff/screenshare/releases"
          target="_blank"
          rel="noopener noreferrer"
          >verify</a
        >
      </footer>
    </div>
  </div>

  <script src="/static/config.js?v=9"></script>
  <script src="/static/crypto.js?v=9"></script>
  <script src="/static/namegen.js?v=9"></script>
  <script src="/static/landing.js?v=9"></script>
</body>
</html>
